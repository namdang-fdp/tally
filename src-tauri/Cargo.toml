[package]
name = "tally"
version = "0.1.0"
description = "Local desktop task tracker"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "tally_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }

[dev-dependencies]
tempfile = "=3.27.0"
